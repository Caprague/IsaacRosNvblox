/**:
  ros__parameters:
    # cuda stream setting
    cuda_stream_type: 1  # 0: cuda default stream, 1: blocking async stream, 2: non blocking async stream, 3: per-thread default stream.
    # miscellaneous
    voxel_size: 0.05
    num_cameras: 1
    use_tf_transforms: true
    mapping_type: "static_tsdf"  # ["static_tsdf", "static_occupancy"]
    pose_frame: "base_link"
    global_frame: "odom_horizontal"

    # Parameters governing frequency of different processing steps in the reconstruction pipeline.
    # Processing happens every n:th tick_period. <=0 means that no processing take place
    tick_period_ms: 20

    # --- Integration thread rates (event-driven, these control per-queue processing frequency) ---
    integrate_depth_rate_hz: 30.0
    integrate_color_rate_hz: 5.0
    integrate_lidar_rate_hz: 5.0

    # --- Height scan thread rate (dedicated 50Hz thread) ---
    publish_locomotion_height_scan_rate_hz: 25.0
    publish_navigation_height_scan_rate_hz: 10.0
    enable_heightscan_stats_logging: true
    heightscan_stats_rate_hz: 20.0
    cuvslam_odom_topic: "/visual_slam/tracking/odometry"

    # --- Terrain cache params (low-freq large-area sampling, 5Hz default) ---
    terrain_cache_range_x: 4.0
    terrain_cache_range_y: 4.0
    terrain_cache_resolution: 0.1
    terrain_cache_update_rate_hz: 10.0
    terrain_cache_max_casting_depth: 2.0
    terrain_cache_z_offset: 0.5

    # --- Ground plane initialization params ---
    ground_plane_init_delay: 10
    ground_plane_height_offset: -0.135

    # --- Locomotion height scan params (high-freq local query, default 1.6x1.0m @ 0.1m) ---
    locomotion_height_scan_range_x: 1.6
    locomotion_height_scan_range_y: 1.0
    locomotion_height_scan_resolution: 0.1
    locomotion_height_scan_x_offset: 0.0
    locomotion_height_scan_y_offset: 0.0
    locomotion_height_scan_z_offset: 0.5
    locomotion_height_scan_max_casting_depth: 2.5
    
    # --- Locomotion height scan online drift compensation ---
    # Enable/disable the center-based drift compensation for locomotion height scan.
    locomotion_height_scan_drift_compensation_enabled: true
    # Expected base-to-ground distance at the center of the scan grid.
    # The center 5x5 points are averaged and compared to this value; the difference
    # is applied as a drift compensation to all points in the published height scan.
    locomotion_height_scan_expected_initial_height: 0.342
    # Sliding window size for filtering the online drift compensation value.
    # A moving average of the last N drift samples is applied. Set to 1 to disable filtering.
    locomotion_height_scan_drift_filter_window: 2

    # --- Maintenance thread rates ---
    # Thread wake-up rate = max(decay_tsdf, decay_dynamic_occupancy, clear_map_outside_radius)
    # Each operation executes at its own rate via shouldProcess gating
    decay_tsdf_rate_hz: 5.0
    decay_dynamic_occupancy_rate_hz: 5.0
    clear_map_outside_radius_rate_hz: 1.0

    # --- Output thread rates ---
    # Thread wake-up rate = max(update_esdf, publish_layer, publish_debug_vis)
    # Each operation executes at its own rate via shouldProcess gating
    update_esdf_rate_hz: -1.0   # Disable
    publish_layer_rate_hz: 5.0
    publish_debug_vis_rate_hz: 5.0

    # --- Other processing rates ---
    update_mesh_rate_hz: 2.0

    # printing statistics on console
    print_rates_to_console: true
    print_timings_to_console: false
    print_delays_to_console: true
    print_queue_drops_to_console: false
    print_statistics_on_console_period_ms: 10000

    # esdf settings
    esdf_mode: "2d" # ["2d", "3d"]
    publish_esdf_distance_slice: true
    # color settings
    use_color: true
    # depth settings
    use_depth: true
    # lidar settings
    use_lidar: false
    use_lidar_depth_image: true
    lidar_width: 900
    lidar_height: 16
    lidar_min_valid_range_m: 0.5
    lidar_max_valid_range_m: 5.0
    use_non_equal_vertical_fov_lidar_params: true
    min_angle_below_zero_elevation_rad: 0.122173  # 7° * π/180
    max_angle_above_zero_elevation_rad: 0.907571  # 52° * π/180
    # Input queues
    maximum_input_queue_length: 5
    # Map clearing settings
    map_clearing_radius_m: 4.0 # no map clearing if < 0.0
    map_clearing_frame_id: "base_link"
    # Map maintenance distance
    distance_map_local_maintenance: 4.0
    # QoS settings
    input_qos: "SYSTEM_DEFAULT"
    # Visualization
    esdf_slice_bounds_visualization_attachment_frame_id: "base_link"
    esdf_slice_bounds_visualization_side_length: 10.0
    workspace_height_bounds_visualization_attachment_frame_id: "base_link"
    workspace_height_bounds_visualization_side_length: 10.0
    layer_visualization_min_tsdf_weight: 0.1
    layer_visualization_exclusion_height_m: 2.0
    layer_visualization_exclusion_radius_m: 4.0
    layer_visualization_undo_gamma_correction: false
    max_back_projection_distance: 4.0
    back_projection_subsampling: 2 # no subsampling if == 1
    layer_streamer_bandwidth_limit_mbps: -1.0 # unlimited

    multi_mapper:
      connected_mask_component_size_threshold: 2000
      remove_small_connected_components: true

    static_mapper:
      # mapper
      do_depth_preprocessing: false
      depth_preprocessing_num_dilations: 3
      # projective integrator (tsdf/color/occupancy)
      projective_integrator_max_integration_distance_m: 4.0
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 5.0
      projective_tsdf_integrator_invalid_depth_decay_factor: -1.0
      # occupancy integrator
      free_region_occupancy_probability: 0.45
      occupied_region_occupancy_probability: 0.55
      unobserved_region_occupancy_probability: 0.5
      occupied_region_half_width_m: 0.1
      # view calculator
      raycast_subsampling_factor: 4
      workspace_bounds_type: "unbounded" # ["unbounded", "height_bounds", "bounding_box"]
      workspace_bounds_min_corner_x_m: 0.0
      workspace_bounds_min_corner_y_m: 0.0
      workspace_bounds_min_height_m: -0.5
      workspace_bounds_max_corner_x_m: 0.0
      workspace_bounds_max_corner_y_m: 0.0
      workspace_bounds_max_height_m: 1.5
      # esdf integrator
      esdf_integrator_min_weight: 0.1
      esdf_integrator_max_site_distance_vox: 1.5
      esdf_integrator_max_distance_m: 1.5
      # mesh integrator
      mesh_integrator_min_weight: 0.1
      mesh_integrator_weld_vertices: true
      # tsdf decay integrator
      tsdf_decay_factor: 0.95
      tsdf_decayed_weight_threshold: 0.05
      exclude_last_view_from_decay: true
      tsdf_set_free_distance_on_decayed: false
      tsdf_decayed_free_distance_vox: 4.0
      decay_integrator_deallocate_decayed_blocks: true
      # mesh streamer
      layer_streamer_exclusion_height_m: 2.0
      layer_streamer_exclusion_radius_m: 4.0
