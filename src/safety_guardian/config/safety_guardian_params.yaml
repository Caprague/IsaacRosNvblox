safety_guardian_node:
  ros__parameters:
    # ========== VSLAM监控参数 ==========

    # VSLAM超时阈值（秒）
    # 如果VSLAM更新间隔超过此值，判定为不安全
    vslam_timeout_threshold: 0.5

    # 位姿变化阈值（米）
    # 如果两次位姿之间的欧氏距离超过此值，判定为不安全
    vslam_position_threshold: 1.0

    # 是否使用TF获取位姿
    # true: 从TF树查询 map/odom -> base_link 变换
    # false: 从话题订阅位姿消息（暂未实现）
    vslam_use_tf: true

    # 备选位姿话题（当 vslam_use_tf 为 false 时使用）
    vslam_pose_topic: "/visual_slam/tracking/vo_pose"

    # ========== 里程计频率安全监控参数 ==========

    # 里程计频率校准时长（秒）
    # 启动后先采集这段时间的 TF 更新，自动计算基准频率
    odom_calibration_duration: 5.0

    # 里程计最低安全频率比例（0~1）
    # 实测频率低于 基准频率 * 此比例 时判定为 unsafe
    odom_min_frequency_ratio: 0.8

    # 里程计频率异常连续确认次数
    # 连续 N 次检测到频率异常才触发 unsafe，避免单次抖动误判
    odom_frequency_violation_count: 5

    # ========== 高程频率安全监控参数 ==========

    # 采样校准时长（秒）
    # 启动后先采集这段时间的消息，自动计算基准频率
    elevation_calibration_duration: 3.0

    # 高程最低安全频率比例（0~1）
    # 实测频率低于 基准频率 * 此比例 时判定为 unsafe
    # 超时阈值自动取 1/(基准频率 * 此比例)
    elevation_min_frequency_ratio: 0.8

    # 高程频率异常连续确认次数
    # 连续 N 次检测到频率异常才触发 unsafe，避免单次抖动误判
    elevation_frequency_violation_count: 5

    # ========== 安全状态发布参数 ==========

    # 安全状态发布频率（Hz）
    # 安全状态话题 /safety_guardian/status 的发布频率
    status_publish_rate: 10.0

    # ========== 诊断信息发布参数 ==========

    # 是否发布诊断信息
    # true: 发布 /safety_guardian/diagnostics 话题
    # false: 不发布诊断信息
    enable_diagnostics: true

    # 诊断信息发布频率（Hz）
    diagnostics_rate: 1.0

    # ========== TF参数 ==========

    # 全局坐标系
    # 通常为 "map" 或 "odom"
    global_frame: "odom_horizontal"

    # 机器人基座坐标系
    # 通常为 "base_link"
    base_frame: "base_link"

    # ========== 启动静默期参数 ==========

    # 启动后静默时长（秒）
    # 节点上线后在此期间内不进行安全状态判断，避免话题连接建立期间的状态误判
    startup_silence_duration: 3.0